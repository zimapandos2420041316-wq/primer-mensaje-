
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera aplicación</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #e8f0fe;
            padding-top: 100px;
        }

        h1 {
            color: #1a237e;
        }

        button {
            background-color: #1565c0;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d47a1;
        }
    </style>
</head>

<body>

    <h1>Mi primera aplicación</h1>

    <button onclick="mostrarMensaje()">
        Mostrar mensaje
    </button>

    <script>
        function mostrarMensaje() {
            alert("¡Bienvenidos a Programación Visual!");
        }
    </script>

</body>
</html>
